name: CI

# Thin caller over jhheider/rust-ci. mdtask is a Unix task runner: its execution
# and MCP tests spawn `sh`/`bash`/`zsh`, so the test matrix is ubuntu + macos (no
# windows, which has no POSIX shell). rust-ci defaults to `--all-features`, so this
# also exercises the `mcp` feature.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE*", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE*", ".gitignore"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: jhheider/rust-ci/.github/workflows/ci.yml@v1
    with:
      os: '["ubuntu-latest", "macos-latest"]'
      coverage: true
    secrets: inherit
