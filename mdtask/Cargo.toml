[package]
name = "mdtask"
version = "0.6.1"
description = "Run tasks defined in markdown: mdtask <name> [args]. A thin CLI over mdtask-core."
keywords = ["task", "runner", "markdown", "cli"]
categories = ["development-tools", "command-line-utilities"]
readme = "../README.md"
default-run = "mdtask"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mdtask-core = { version = "0.6", path = "../mdtask-core" }
serde_json = { version = "1", optional = true }

[features]
mcp = ["dep:serde_json"]

# rust-ci's release.yml ships assets as `mdtask-{os}-{arch}.{ext}` (no version,
# no full target triple), which matches none of binstall's default guess
# templates, so binstall silently fell back to compiling from source.
# archive-suffix resolves against every extension binstall knows for the
# given pkg-fmt (both .tgz and .tar.gz for Tgz), so this matches the actual
# .tar.gz assets without hardcoding it.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ os-name }-{ target-arch }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
